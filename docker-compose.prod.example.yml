# Example self-hosted deploy stack. This is a starting point, not a
# ready-to-run file for your specific server — adapt volumes, the external
# network name, and exposed ports to how your own host is set up (e.g.
# nginx proxy manager, Traefik, whatever you're already running). That
# adaptation is intentionally out of scope for this project to prescribe.
#
# Differences from docker-compose.yml (dev):
#   - backend runs a published image (GHCR) instead of building from source
#   - backend joins an existing external Docker network so a reverse proxy
#     on that network can reach it
#   - powersync runs a published image with config.yaml/sync-rules.yaml
#     baked in (see powersync/Dockerfile), instead of bind-mounting ./powersync —
#     see ADR-0007
services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: innbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: innbo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innbo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  backend:
    image: ghcr.io/mathiazom/innbo-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://innbo:${POSTGRES_PASSWORD}@postgres:5432/innbo
      JWT_SECRET: ${JWT_SECRET}
      POWERSYNC_DB_PASSWORD: ${POWERSYNC_DB_PASSWORD}
      LISTEN_ADDR: :8080
      STORAGE_DIR: /data/images
      POWERSYNC_PUBLIC_URL: ${POWERSYNC_PUBLIC_URL}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - backend-images:/data/images
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - npm-network # rename/replace with whatever your reverse proxy actually uses

  # PowerSync's MongoDB bucket storage uses transactions, which MongoDB
  # only allows on a replica set (even a single-node one) — plain
  # standalone mongod fails with "Transaction numbers are only allowed on
  # a replica set member or mongos". mongo-rs-init below is a one-shot
  # sidecar that initiates that replica set, matching PowerSync's own
  # self-host-demo reference setup.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  mongo-rs-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: on-failure
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo:27017 --eval
        'try{rs.status().ok && quit(0)} catch {}
        try{rs.initiate({_id: "rs0", version: 1, members: [{ _id: 0, host: "mongo:27017" }]})} catch {}'
    networks:
      - default

  powersync:
    image: ghcr.io/mathiazom/innbo-powersync:${IMAGE_TAG:-latest}
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
      PS_DATA_SOURCE_URI: postgres://powersync_repl:${POWERSYNC_DB_PASSWORD}@postgres:5432/innbo
      PS_MONGO_URI: mongodb://mongo:27017/powersync
      PS_PORT: "8081"
      PS_JWT_SECRET: ${JWT_SECRET}
      PS_ADMIN_TOKEN: ${POWERSYNC_ADMIN_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
    networks:
      - default
      - npm-network

volumes:
  postgres-data:
  mongo-data:
  backend-images:

networks:
  default:
  npm-network:
    external: true
    name: ${NPM_NETWORK_NAME}
