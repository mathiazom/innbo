name: Client artifacts

# Release-triggered only — these builds are heavy, and a released version
# is the point where we actually want a signed/reproducible APK + .dmg, not
# on every push. Deliberately `release: published`, not `push: tags` — a
# tag created as part of publishing a release (e.g. via `gh release
# create`, as scripts/release.sh does) doesn't reliably fire a `push`
# event, only `release`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build for (e.g. v0.1.0)"
        required: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"

      - run: flutter pub get

      # Release signing: see android/key.properties.example and
      # android/app/build.gradle.kts. Without these secrets set, the build
      # falls back to debug signing, which uses a different random key on
      # every CI run — Android then refuses to install the new APK over an
      # existing install (different signature), forcing an uninstall that
      # wipes local data.
      - name: Write release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/innbo-release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=innbo-release.keystore
          EOF

      - run: flutter build apk --release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: client/build/app/outputs/flutter-apk/app-release.apk

  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"

      - run: flutter pub get

      # CI has no Apple Developer Team/certificate — disable signing
      # rather than relying on automatic signing (which only works where
      # a Team is selected locally, e.g. a developer's own Mac).
      - run: flutter build macos --release
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: "-"

      # Unsigned/not notarized for v0 — Gatekeeper will warn on install.
      # See docs/INSTALL-MACOS.md for the one-time workaround.
      - name: Package .dmg
        run: |
          hdiutil create -volname Innbo \
            -srcfolder build/macos/Build/Products/Release/Innbo.app \
            -ov -format UDZO Innbo.dmg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: client/Innbo.dmg
