name: Backend image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing api-vX.Y.Z release tag to build for"
        required: true

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'api-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/innbo-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.release.tag_name || inputs.tag }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
